name: Update Fear & Greed France

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update.js"
      - "scripts/backfill.js"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "40 17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fear-greed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update data
        run: node scripts/update.js

      - name: Backfill 2026 history
        run: node scripts/backfill.js

      - name: Commit refreshed JSON
        shell: bash
        run: |
          if git diff --quiet -- data/; then
            echo "No data change."
            exit 0
          fi
          git config user.name "fear-greed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: update Fear & Greed France"
          git push
